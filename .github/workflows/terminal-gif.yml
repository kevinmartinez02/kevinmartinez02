name: Generate Terminal GIF

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0" # weekly, Sundays 06:00 UTC
  push:
    branches: [main]
    paths:
      - terminal_gif.py
      - .github/workflows/terminal-gif.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install gifos
        run: python -m pip install --upgrade github-readme-terminal

      - name: Generate GIF
        run: python terminal_gif.py

      - name: Commit and push GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output.gif
          git commit -m "chore: update terminal GIF" || echo "No changes to commit"
          git push
