name: Generate Profile GIFs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  push:
    branches: [main]
    paths:
      - claude_profile_gif.py
      - language_stats_gif.py
      - assets/**
      - .github/workflows/terminal-gif.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install animation dependencies
        run: python -m pip install --upgrade pillow requests

      - name: Generate GIFs
        run: |
          python claude_profile_gif.py
          python language_stats_gif.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push GIFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add claude-profile.gif language-stats.gif
          git commit -m "chore: update profile GIFs" || echo "No changes to commit"
          git push
